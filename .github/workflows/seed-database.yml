name: Seed database
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the CSV exports to the data release
        type: boolean
        default: false
  schedule:
  # At 04:00pm daily
  - cron: "0 16 * * *"
permissions:
    contents: read
jobs:
    seed:
        name: Seed database
        runs-on: ubuntu-22.04
        steps:
            - name: Check out code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: npm
            - name: Seed
              run: |
                  npm ci
                  npm run seed
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  STEAM_KEY: ${{ secrets.STEAM_KEY }}
            - name: Export
              if: inputs.publish
              run: npm run export
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
            - name: Upload the exports
              if: inputs.publish
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: export
                  path: export/*.csv.gz
                  retention-days: 1
    # Runs no npm code, so the write token never shares a job with dependencies
    publish:
        name: Publish to the data release
        needs: seed
        if: inputs.publish
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        steps:
            - name: Check out code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: .github/data-release.md
                  sparse-checkout-cone-mode: false
            - name: Download the exports
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: export
                  path: export
            - name: Publish to the data release
              run: |
                  gh release view data > /dev/null 2>&1 || gh release create data --title "Steam game list" --notes-file .github/data-release.md
                  gh release edit data --notes-file .github/data-release.md
                  gh release upload data export/*.csv.gz --clobber
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
